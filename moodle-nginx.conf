# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

# 2. WWW -> NON-WWW & HTTPS Redirection
server {
    listen 443 ssl http2;
    server_name www.__DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    return 301 https://__DOMAIN__$request_uri;
}

# 3. Main Moodle 5.1 Server Block
server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    root __MOODLE_DIR__/public; # Moodle 5.1 Web Root
    index index.php;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;

    # Moodle 5.1 Routing Engine
    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }

    # PHP-FPM Handling
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        
        # Check for file existence, else fallback to router
        try_files $fastcgi_script_name $fastcgi_script_name/ /r.php$is_args$args;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_read_timeout 900s;
        fastcgi_send_timeout 900s;
        send_timeout 900s;
    }

    error_page 404 /error/index.php;

    # X-Accel-Redirect for file performance
    location /dataroot/ {
        internal;
        alias __MOODLE_DATA_DIR__/;
    }

    # Security: Block sensitive files
    location ~ /\.(?!well-known).* { deny all; }
    
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|UPGRADING\.md|UPGRADING\-CURRENT\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml) {
        deny all;
        return 404;
    }
    # Deny all direct access to the vendor directory
    location /vendor/ {
        deny all;
        return 404;
    }

    # --- SECURITY HEADERS ---
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload';
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin";
    add_header Permissions-Policy "geolocation=(self),midi=(),sync-xhr=(),microphone=(self),camera=(self),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://player.vimeo.com https://*.vimeocdn.com https://*.gravatar.com https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.zoom.us https://*.microsoft.com https://*.linkedin.com https://*.twitter.com https://*.facebook.net https://*.ytimg.com https://*.h5p.org; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; frame-src 'self' https://player.vimeo.com https://*.vimeo.com https://*.vimeocdn.com https://*.moodle.org https://*.moodle.net https://*.google.com https://*.youtube.com https://*.zoom.us https://*.microsoft.com https://*.sharepoint.com https://*.linkedin.com https://*.facebook.com https://*.twitter.com https://*.h5p.com *.turnitin.com; connect-src 'self' https:; object-src 'none';" always;
}
